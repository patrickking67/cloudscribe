name: Bug report
description: Something in the compiler, CLI or generated JavaScript does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Smallest .csc source that shows it
      render: csc
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: cloudscribe example.csc --run
  - type: textarea
    id: output
    attributes:
      label: Output or error message
      render: text
  - type: input
    id: version
    attributes:
      label: CloudScribe version or commit
      description: Output of `cloudscribe --version` or `git rev-parse --short HEAD`
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and OS
      placeholder: Node 22.12.0 on macOS 15
    validations:
      required: true
